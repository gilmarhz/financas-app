<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2e7d5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Finanças</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #2e7d5b;
      --primary-dark: #1f5a40;
      --primary-light: #4ea87d;
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2e26;
      --text-light: #7a8b82;
      --success: #27ae60;
      --success-dark: #1e8e4d;
      --danger: #e74c3c;
      --danger-dark: #c0392b;
      --warning: #f39c12;
      --border: #e1e8e3;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 14px 20px 12px;
      padding-top: calc(14px + env(safe-area-inset-top));
      box-shadow: var(--shadow-lg);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    .export-buttons {
      display: flex;
      gap: 6px;
    }

    .btn-export {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.72rem;
      line-height: 1;
      letter-spacing: 0.3px;
    }

    .btn-export:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.95);
    }

    .btn-export:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .total-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .balance-label {
      font-size: 0.68rem;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .balance-value {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.5px;
      transition: color 0.3s;
    }

    .balance-value.negative { color: #ffcdd2; }

    .balance-breakdown {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .breakdown-item {
      flex: 1;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .breakdown-icon { font-size: 0.95rem; }

    .breakdown-content { flex: 1; min-width: 0; }

    .breakdown-label {
      font-size: 0.58rem;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .breakdown-value {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breakdown-income .breakdown-value { color: #a5f5c5; }
    .breakdown-expense .breakdown-value { color: #ffb3ab; }

    .month-filter {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .month-filter label {
      font-size: 0.85rem;
      color: var(--text-light);
      font-weight: 500;
    }

    .month-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }

    .month-input:focus {
      border-color: var(--primary);
      background: white;
    }

    .btn-clear-month {
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }

    .btn-clear-month:active { background: var(--border); }

    .filters {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      box-shadow: var(--shadow);
    }

    .filters::-webkit-scrollbar { height: 4px; }
    .filters::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .filter-chip {
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
      font-weight: 500;
      flex-shrink: 0;
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-chip:active { transform: scale(0.95); }

    .form-area {
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-row:last-child { margin-bottom: 0; }

    .form-input, .form-select, .form-date {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      min-width: 0;
    }

    .form-input:focus, .form-select:focus, .form-date:focus {
      border-color: var(--primary);
      background: white;
    }

    .form-input::placeholder { color: var(--text-light); }

    .amount-wrapper {
      flex: 0 0 130px;
      position: relative;
    }

    .amount-wrapper::before {
      content: 'R$';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-weight: 600;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 1;
    }

    .amount-wrapper .form-input {
      padding-left: 34px;
      width: 100%;
    }

    .date-wrapper { flex: 1; }
    .date-wrapper .form-date { width: 100%; }

    .action-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      line-height: 1;
      padding: 0;
    }

    .action-btn:active { transform: scale(0.92); }

    .action-btn.btn-expense {
      background: var(--danger);
      box-shadow: 0 3px 0 var(--danger-dark);
    }
    .action-btn.btn-expense:active {
      background: var(--danger-dark);
      box-shadow: 0 1px 0 var(--danger-dark);
    }

    .action-btn.btn-income {
      background: var(--success);
      box-shadow: 0 3px 0 var(--success-dark);
    }
    .action-btn.btn-income:active {
      background: var(--success-dark);
      box-shadow: 0 1px 0 var(--success-dark);
    }

    .charts-section {
      padding: 16px 20px 8px;
      background: var(--bg);
    }

    .chart-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-subtitle {
      font-size: 0.72rem;
      color: var(--text-light);
      font-weight: 500;
    }

    .pie-container {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .pie-svg-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      flex-shrink: 0;
    }

    .pie-legend {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 180px;
      overflow-y: auto;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      padding: 3px 0;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-name {
      flex: 1;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-value {
      color: var(--text-light);
      font-weight: 600;
      font-size: 0.75rem;
    }

    .bars-scroll-wrapper {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      padding-bottom: 4px;
      scroll-behavior: smooth;
    }

    .bars-scroll-wrapper::-webkit-scrollbar { height: 6px; }
    .bars-scroll-wrapper::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 3px;
    }
    .bars-scroll-wrapper::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .bars-container {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 180px;
      padding: 8px 0 20px;
      min-width: 100%;
    }

    .bar-group {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      position: relative;
    }

    .bar-column {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .bar {
      width: 45%;
      max-width: 18px;
      border-radius: 3px 3px 0 0;
      transition: height 0.3s, opacity 0.2s;
      min-height: 2px;
    }

    .bar-income { background: var(--success); }
    .bar-expense { background: var(--danger); }

    .bar-label {
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 4px;
      font-weight: 600;
      white-space: nowrap;
    }

    .bar-group.current .bar-label {
      color: var(--primary);
      font-weight: 700;
    }

    .chart-empty {
      text-align: center;
      color: var(--text-light);
      font-size: 0.8rem;
      padding: 30px 0;
    }

    .scroll-hint {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      color: var(--text-light);
      margin-top: 4px;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .scroll-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .expense-list {
      flex: 1;
      padding: 16px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
    }

    .expense-group-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 4px 4px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .expense-group-total {
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
    }

    .expense-item {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: slideIn 0.3s ease;
      transition: opacity 0.3s, transform 0.3s;
      border-left: 4px solid transparent;
    }

    .expense-item.type-expense { border-left-color: var(--danger); }
    .expense-item.type-income { border-left-color: var(--success); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .expense-item.removing {
      opacity: 0;
      transform: translateX(40px) scale(0.9);
    }

    .category-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .expense-content { flex: 1; min-width: 0; }

    .expense-desc {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .expense-meta {
      font-size: 0.75rem;
      color: var(--text-light);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .expense-amount {
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      text-align: right;
    }

    .expense-amount.amount-expense { color: var(--danger); }
    .expense-amount.amount-income { color: var(--success); }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.2s, background 0.2s, transform 0.1s;
      font-size: 1.1rem;
      line-height: 1;
    }

    .btn-delete:active {
      color: var(--danger);
      background: #fdeaea;
      transform: scale(0.9);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
      color: var(--text-light);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h2 {
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .empty-state p {
      font-size: 0.9rem;
      max-width: 280px;
      line-height: 1.5;
    }

    .footer {
      padding: 12px 20px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-light);
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .cat-alimentacao { background: #ffebee; }
    .cat-transporte { background: #e3f2fd; }
    .cat-moradia { background: #f3e5f5; }
    .cat-saude { background: #e8f5e9; }
    .cat-lazer { background: #fff3e0; }
    .cat-educacao { background: #e0f7fa; }
    .cat-outros { background: #eceff1; }
    .cat-salario { background: #e8f5e9; }
    .cat-freelance { background: #e0f7fa; }
    .cat-investimentos { background: #fff8e1; }
    .cat-mesada { background: #fce4ec; }
    .cat-apostas { background: #ede7f6; }
    .cat-vendas { background: #fff3e0; }
    .cat-doacoes { background: #f1f8e9; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1f2e26;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, opacity 0.3s;
      opacity: 0;
      z-index: 300;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }

    @media (hover: hover) {
      .btn-delete:hover { color: var(--danger); }
      .filter-chip:hover:not(.active) { background: var(--border); }
    }

    @media (min-width: 600px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }

    @media (max-width: 380px) {
      .amount-wrapper { flex: 0 0 110px; }
      .action-btn { width: 44px; height: 44px; font-size: 1.3rem; }
      .balance-value { font-size: 1.3rem; }
      .btn-export { padding: 5px 8px; font-size: 0.68rem; }
      .header h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <h1>💰 Finanças</h1>
      <div class="export-buttons">
        <button class="btn-export" id="exportExcelBtn" aria-label="Exportar para Excel">Excel</button>
        <button class="btn-export" id="exportPdfBtn" aria-label="Exportar para PDF">PDF</button>
      </div>
    </div>
    <div class="total-card">
      <div class="balance-label">Saldo do período</div>
      <div class="balance-value" id="balanceValue">R$ 0,00</div>
      <div class="balance-breakdown">
        <div class="breakdown-item breakdown-income">
          <div class="breakdown-icon">📈</div>
          <div class="breakdown-content">
            <div class="breakdown-label">Receitas</div>
            <div class="breakdown-value" id="incomeValue">R$ 0,00</div>
          </div>
        </div>
        <div class="breakdown-item breakdown-expense">
          <div class="breakdown-icon">📉</div>
          <div class="breakdown-content">
            <div class="breakdown-label">Despesas</div>
            <div class="breakdown-value" id="expenseValue">R$ 0,00</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="month-filter">
    <label for="monthFilter">📅 Mês:</label>
    <input type="month" id="monthFilter" class="month-input">
    <button class="btn-clear-month" id="clearMonthBtn">Tudo</button>
  </div>

  <div class="filters" id="filtersBar">
    <button class="filter-chip active" data-filter="all">📋 Todas</button>
    <button class="filter-chip" data-filter="alimentacao">🍔 Alimentação</button>
    <button class="filter-chip" data-filter="transporte">🚗 Transporte</button>
    <button class="filter-chip" data-filter="moradia">🏠 Moradia</button>
    <button class="filter-chip" data-filter="saude">💊 Saúde</button>
    <button class="filter-chip" data-filter="lazer">🎮 Lazer</button>
    <button class="filter-chip" data-filter="educacao">📚 Educação</button>
    <button class="filter-chip" data-filter="salario">💼 Salário</button>
    <button class="filter-chip" data-filter="freelance">💻 Freelance</button>
    <button class="filter-chip" data-filter="investimentos">📈 Investimentos</button>
    <button class="filter-chip" data-filter="mesada">🎁 Mesada</button>
    <button class="filter-chip" data-filter="apostas">🎲 Apostas</button>
    <button class="filter-chip" data-filter="vendas">🏷️ Vendas</button>
    <button class="filter-chip" data-filter="doacoes">❤️ Doações</button>
    <button class="filter-chip" data-filter="outros">📦 Outros</button>
  </div>

  <div class="form-area">
    <div class="form-row">
      <input type="text" id="descInput" class="form-input" placeholder="Descrição" maxlength="80" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="amount-wrapper">
        <input type="number" id="amountInput" class="form-input" placeholder="0,00" step="0.01" min="0.01" inputmode="decimal">
      </div>
      <select id="categoryInput" class="form-select">
        <optgroup label="Despesas">
          <option value="alimentacao">🍔 Alimentação</option>
          <option value="transporte">🚗 Transporte</option>
          <option value="moradia">🏠 Moradia</option>
          <option value="saude">💊 Saúde</option>
          <option value="lazer">🎮 Lazer</option>
          <option value="educacao">📚 Educação</option>
          <option value="outros">📦 Outros</option>
        </optgroup>
        <optgroup label="Receitas">
          <option value="salario">💼 Salário</option>
          <option value="freelance">💻 Freelance</option>
          <option value="investimentos">📈 Investimentos</option>
